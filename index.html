<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>课堂实时翻译</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://translator-api.xyy3041964059.workers.dev; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'">
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#11161c;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#238636;--red:#da3633;--gold:#9e6a03}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#bar{position:sticky;top:0;z-index:5;background:var(--panel);padding:10px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font-size:14px;padding:7px 12px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
#startBtn{background:var(--green);color:#fff}#stopBtn{background:var(--red);color:#fff}
.gray{background:#30363d;color:#fff;font-size:13px;padding:6px 10px}
.glossary-active{background:var(--gold);color:#fff;font-size:13px;padding:6px 10px}
button:disabled{opacity:.4;cursor:not-allowed}
#status{font-size:13px;color:var(--muted);flex:1;text-align:right;min-width:160px}
#live{padding:16px;min-height:72px;border-bottom:3px solid var(--line);background:var(--panel2)}
#liveEn{color:var(--blue);line-height:1.5;word-break:break-word}
#liveZh{color:#fff;font-weight:bold;margin-top:4px;line-height:1.5}
#hist{padding:16px}
.item{margin-bottom:14px;padding:12px;border-radius:8px;background:var(--panel)}
.spk{font-size:13px;font-weight:bold;padding:2px 8px;border-radius:6px;color:#fff;margin-bottom:6px;display:inline-block}
.en{color:#7d8590;line-height:1.5;word-break:break-word}
.zh{color:#fff;font-weight:bold;margin-top:6px;line-height:1.5}
#glossaryOverlay,#settingsOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99;justify-content:center;align-items:center;padding:16px}
#glossaryOverlay.show,#settingsOverlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:560px;max-height:84vh;display:flex;flex-direction:column}
.modal h3{margin:0 0 6px;color:var(--text);font-size:16px}
.modal p{font-size:12px;color:var(--muted);margin:0 0 10px}
textarea,input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:inherit;font-size:13px}
textarea{resize:vertical;min-height:160px;font-family:Consolas,monospace}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.actions button{padding:7px 16px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>
<div id="bar">
<button id="startBtn">开始</button>
<button id="stopBtn" disabled>停止</button>
<button id="spkBtn" class="gray">分人：关</button>
<button id="glossaryBtn" class="gray">术语库</button>
<button id="settingsBtn" class="gray">设置</button>
<button id="ctxBtn" class="gray">上下文</button>
<button id="fontDown" class="gray">A-</button>
<button id="fontUp" class="gray">A+</button>
<button id="exportBtn" class="gray">导出</button>
<span id="status">未开始</span>
</div>
<div id="live"><div id="liveEn"></div><div id="liveZh"></div></div>
<div id="hist"></div>
<div id="glossaryOverlay">
<div class="modal">
<h3>术语库</h3>
<p>每行一个术语：英文=中文</p>
<textarea id="glossaryTextarea" spellcheck="false"></textarea>
<div class="actions">
<button id="glossaryClear" class="gray">清空</button>
<button id="glossarySave" style="background:#238636;color:#fff">保存</button>
</div>
</div>
</div>
<div id="settingsOverlay">
<div class="modal">
<h3>翻译设置</h3>
<label for="apiInput">翻译 Worker 地址</label>
<input id="apiInput" type="url">
<label for="modeSelect">翻译风格</label>
<select id="modeSelect">
<option value="lecture">课堂字幕：自然准确</option>
<option value="literal">忠实直译</option>
<option value="notes">复习笔记</option>
</select>
<label for="courseInput">课程/领域提示</label>
<input id="courseInput" placeholder="例如：传媒研究、设计软件">
<div class="actions">
<button id="settingsCancel" class="gray">取消</button>
<button id="settingsSave" style="background:#238636;color:#fff">保存</button>
</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const startBtn=$("startBtn"),stopBtn=$("stopBtn"),spkBtn=$("spkBtn"),statusEl=$("status"),liveEn=$("liveEn"),liveZh=$("liveZh"),hist=$("hist"),fontUp=$("fontUp"),fontDown=$("fontDown"),exportBtn=$("exportBtn"),glossaryBtn=$("glossaryBtn"),settingsBtn=$("settingsBtn"),ctxBtn=$("ctxBtn");
const glossaryOverlay=$("glossaryOverlay"),glossaryTextarea=$("glossaryTextarea"),glossarySave=$("glossarySave"),glossaryClear=$("glossaryClear");
const settingsOverlay=$("settingsOverlay"),apiInput=$("apiInput"),modeSelect=$("modeSelect"),courseInput=$("courseInput"),settingsSave=$("settingsSave"),settingsCancel=$("settingsCancel");
const DEFAULT_API="https://translator-api.xyy3041964059.workers.dev";
const TOKEN_PATH="/token";
const TRANSLATE_PATH="/translate";
const DEFAULT_GLOSSARY="academic integrity=学术诚信\nplagiarism=抄袭\npeer review=同行评审\ncitation=引用\nmethodology=研究方法\nrhetoric=修辞学\nstakeholder=利益相关者\nuser interface=用户界面\nuser experience=用户体验\nprototype=原型\nresponsive design=响应式设计\ntypography=字体排印\ncinematography=电影摄影\nstoryboard=分镜脚本\npost-production=后期制作\nnarrative structure=叙事结构\nmedia literacy=媒介素养\ndigital media=数字媒体\nsemiotics=符号学\nrepresentation=表征\nlayer=图层\nmask=蒙版\nopacity=不透明度\nblending mode=混合模式\nfilter=滤镜\nresolution=分辨率\npixel=像素\nvector=矢量\npath=路径\nanchor point=锚点\nstroke=描边\nfill=填充\ngradient=渐变\ntimeline=时间线\nkeyframe=关键帧\ntransition=转场\nrender=渲染\nexport=导出\ncomposition=合成\nmotion graphics=动态图形\nvisual effects=视觉特效\ngreen screen=绿幕\nlayout=版面布局\nmargin=页边距\nasset=素材\nworkflow=工作流";
let ws,ac,proc,src,stream,run=false;
let buf="",bufWords=[],diarize=false,pendingFiller="";
let glossary=localStorage.getItem("glossary")||DEFAULT_GLOSSARY;
let fontScale=parseFloat(localStorage.getItem("fontScale")||"1");
let apiUrl=sanitizeApiUrl(localStorage.getItem("apiUrl")||DEFAULT_API);
let mode=localStorage.getItem("translationMode")||"lecture";
let courseHint=localStorage.getItem("courseHint")||"";
let contextHistory=[];
let contextEnabled=localStorage.getItem("contextEnabled")!=="0";
const CONTEXT_LIMIT=5,MAX_ITEMS=200,MAX_CHARS=500,MIN_WORDS=7,SOFT_WORDS=24,HARD_WORDS=36;
const DEEPGRAM_ENDPOINTING_MS=750,DEEPGRAM_UTTERANCE_END_MS=1200;
const MAX_TEXT_CHARS=1200,MAX_GLOSSARY_CHARS=2000;
const TRANSLATION_TOKEN_HEADER="X-Translation-Token";
const TOKEN_REFRESH_WINDOW_MS=10_000;
let sessionToken={value:null,expiresAt:0};
let tokenPromise=null;
const COLORS=["#1f6feb","#238636","#9e6a03","#a371f7","#bf3989","#1b7c83","#da3633"];
const FILLERS=new Set(["fuck","fk","fck","shit","damn","crap","yeah","yep","yes","yup","no","nope","nah","okay","ok","alright","all right","um","uh","ah","oh","hmm","huh","well","so","right","actually","basically","anyway","hey","hi","hello","wow","like","just","you know","i mean","of course","sure","thanks","thank you","please","sorry","excuse me"]);
function st(t){statusEl.textContent=t}
function getApiBase(){return String(apiUrl||DEFAULT_API).replace(/\/+$/,"")}
function getTokenUrl(){return `${getApiBase()}${TOKEN_PATH}`}
function getTranslateUrl(){return `${getApiBase()}${TRANSLATE_PATH}`}
function isTokenValid(){return sessionToken.value&&Number(sessionToken.expiresAt)>Date.now()+TOKEN_REFRESH_WINDOW_MS}
function sanitizeApiUrl(value){
  try{
    const u=new URL(value.trim());
    if(!/^https?:$/i.test(u.protocol)) throw new Error("bad scheme");
    return `${u.protocol}//${u.host}`;
  }catch(e){
    return DEFAULT_API;
  }
}
function normalizeApiSettings(){
  apiUrl=sanitizeApiUrl(apiInput.value||DEFAULT_API);
  mode=modeSelect.value;
  courseHint=courseInput.value.trim();
  localStorage.setItem("apiUrl",apiUrl);
  localStorage.setItem("translationMode",mode);
  localStorage.setItem("courseHint",courseHint);
}
async function getTranslationToken(force=false){
  if (!force && isTokenValid()) return sessionToken.value;
  if (tokenPromise) return tokenPromise;
  tokenPromise=(async()=>{const r=await fetch(getTokenUrl(),{method:"POST",headers:{"Content-Type":"application/json"},body:'{}'});let j={};try{j=await r.json()}catch(e){}if(!r.ok||!j||typeof j.token!=="string"||!j.expiresAt||Number(j.expiresAt)<=Date.now()){throw new Error("获取识别凭证失败")}sessionToken={value:j.token,expiresAt:Number(j.expiresAt)};return sessionToken.value})(); 
  try{return await tokenPromise}finally{tokenPromise=null}
}
function spkColor(n){return COLORS[n%COLORS.length]}
function isFiller(t){const s=t.trim().toLowerCase().replace(/[,;:'"!]+$/,"").replace(/^[,;:'"]+/,"").replace(/[.?!]+$/,"");if(s.split(/\s+/).length>3)return false;return FILLERS.has(s)}
function refreshGlossaryButton(){if(glossary){glossaryBtn.className="glossary-active";glossaryBtn.textContent="术语库✓"}else{glossaryBtn.className="gray";glossaryBtn.textContent="术语库"}}
function applyFont(){liveEn.style.fontSize=(20*fontScale)+"px";liveZh.style.fontSize=(22*fontScale)+"px";document.querySelectorAll(".en").forEach(el=>el.style.fontSize=(17*fontScale)+"px");document.querySelectorAll(".zh").forEach(el=>el.style.fontSize=(21*fontScale)+"px")}
function rememberContext(en,zh){if(!contextEnabled)return;contextHistory.push({en,zh});if(contextHistory.length>CONTEXT_LIMIT)contextHistory=contextHistory.slice(-CONTEXT_LIMIT)}
glossaryTextarea.value=glossary;apiInput.value=apiUrl;modeSelect.value=mode;courseInput.value=courseHint;refreshGlossaryButton();applyFont();
if(contextEnabled){ctxBtn.className="glossary-active";ctxBtn.textContent="上下文：开"}else{ctxBtn.className="gray";ctxBtn.textContent="上下文：关"}
ctxBtn.onclick=()=>{contextEnabled=!contextEnabled;localStorage.setItem("contextEnabled",contextEnabled?"1":"0");if(contextEnabled){ctxBtn.className="glossary-active";ctxBtn.textContent="上下文：开"}else{ctxBtn.className="gray";ctxBtn.textContent="上下文：关";contextHistory=[]}};
glossaryBtn.onclick=()=>{glossaryOverlay.classList.add("show");glossaryTextarea.focus()};
glossaryOverlay.onclick=e=>{if(e.target===glossaryOverlay)glossaryOverlay.classList.remove("show")};
glossarySave.onclick=()=>{glossary=glossaryTextarea.value.trim();localStorage.setItem("glossary",glossary);refreshGlossaryButton();glossaryOverlay.classList.remove("show")};
glossaryClear.onclick=()=>{glossaryTextarea.value=""};
settingsBtn.onclick=()=>{apiInput.value=apiUrl;modeSelect.value=mode;courseInput.value=courseHint;settingsOverlay.classList.add("show")};
settingsOverlay.onclick=e=>{if(e.target===settingsOverlay)settingsOverlay.classList.remove("show")};
settingsCancel.onclick=()=>settingsOverlay.classList.remove("show");
settingsSave.onclick=()=>{normalizeApiSettings();settingsOverlay.classList.remove("show")};
fontUp.onclick=()=>{fontScale=Math.min(2.5,fontScale+0.15);localStorage.setItem("fontScale",fontScale);applyFont()};
fontDown.onclick=()=>{fontScale=Math.max(0.6,fontScale-0.15);localStorage.setItem("fontScale",fontScale);applyFont()};
exportBtn.onclick=()=>{const items=hist.getElementsByClassName("item");if(!items.length){alert("没有内容可导出");return}let txt="";for(let i=items.length-1;i>=0;i--){txt+=items[i].querySelector(".en").textContent+"\n"+items[i].querySelector(".zh").textContent+"\n\n"}const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);const d=new Date();a.download="课堂记录_"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+"_"+d.getHours()+"."+d.getMinutes()+".txt";a.click()};
spkBtn.onclick=()=>{if(run){alert("请先停止识别");return}diarize=!diarize;spkBtn.textContent=diarize?"分人：开":"分人：关"};
async function startRecognize(){
  try{await getTranslationToken();}catch(e){st("获取密钥失败");alert(e.message || "无法获取识别凭证");return}
  try{st("申请麦克风...");stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}})}catch(e){st("麦克风失败");alert(e.message);return}
  ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});if(ac.state==="suspended")await ac.resume();src=ac.createMediaStreamSource(stream);proc=ac.createScriptProcessor(4096,1,1);src.connect(proc);proc.connect(ac.destination);
  let url="wss://api.deepgram.com/v1/listen?model=nova-3&language=en&smart_format=true&punctuate=true&interim_results=true&endpointing="+DEEPGRAM_ENDPOINTING_MS+"&utterance_end_ms="+DEEPGRAM_UTTERANCE_END_MS+"&vad_events=true&encoding=linear16&sample_rate=16000&channels=1&noise_reduction=true";
  if(diarize)url+="&diarize=true";
  st(diarize?"连接中（分人开）...":"连接中...");
  ws=new WebSocket(url,["token",sessionToken.value]);
  ws.onopen=()=>{run=true;st(diarize?"正在识别（分人开）":"正在识别");startBtn.disabled=true;stopBtn.disabled=false;spkBtn.disabled=true;proc.onaudioprocess=e=>{if(!run||ws.readyState!==1)return;const a=e.inputBuffer.getChannelData(0);const p=new Int16Array(a.length);for(let i=0;i<a.length;i++){const s=Math.max(-1,Math.min(1,a[i]));p[i]=s<0?s*0x8000:s*0x7FFF}ws.send(p.buffer)}};ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.type==="UtteranceEnd"){flushReady(false);return}if(m.type!=="Results")return;const al=m.channel&&m.channel.alternatives&&m.channel.alternatives[0];if(!al||!al.transcript)return;const tx=al.transcript;if(m.is_final){buf=(buf+" "+tx).trim();if(diarize&&al.words&&al.words.length)al.words.forEach(w=>bufWords.push(w.speaker||0));splitSentencesBuf();liveEn.textContent=buf;if(m.speech_final)flushReady(false)}else{liveEn.textContent=(buf+" "+tx).trim()}};ws.onerror=()=>st("WebSocket 错误");ws.onclose=()=>{if(run)st("连接断开");clean()}};
}
startBtn.onclick=async()=>{if(run)return;contextHistory=[];await startRecognize();}
stopBtn.onclick=()=>{run=false;flush();if(ws&&ws.readyState===1){try{ws.send(JSON.stringify({type:"CloseStream"}))}catch(e){}ws.close()}contextHistory=[];clean();st("已停止");startBtn.disabled=false;stopBtn.disabled=true;spkBtn.disabled=false};
function majoritySpeakerOf(start,count){const cnt={};let best=0,bestN=-1;for(let i=start;i<start+count&&i<bufWords.length;i++){const s=bufWords[i];cnt[s]=(cnt[s]||0)+1;if(cnt[s]>bestN){bestN=cnt[s];best=s}}return best}
function wc(t){return t.trim()?t.trim().split(/\s+/).length:0}
function findCut(text,force){text=text.trim();if(!text)return 0;let soft=0;const re=/[.?!,;:]/g;let m;while((m=re.exec(text))!==null){const part=text.slice(0,m.index+1),words=wc(part),mark=m[0];if(/[.?!]/.test(mark))return m.index+1;if(words>=SOFT_WORDS)soft=m.index+1}if(soft)return soft;const words=wc(text);if(force||words>=HARD_WORDS){const tokens=text.match(/\S+\s*/g)||[];const take=force?tokens.length:Math.min(tokens.length,HARD_WORDS);return tokens.slice(0,take).join("").length}return 0}
function splitSentencesBuf(){let emitted=false;for(;;){const cut=findCut(buf,false);if(cut<=0)break;const s=buf.slice(0,cut).trim();if(s){if(isFiller(s)){pendingFiller+=(pendingFiller?" ":"")+s}else{const final=pendingFiller?pendingFiller+" "+s:s;pendingFiller="";chunkAndArchive(final)}emitted=true}buf=buf.slice(cut).trim()}if(emitted){liveEn.textContent=buf;liveZh.textContent=""}}
function flushReady(force){const cut=findCut(buf,force);if(cut<=0)return;let s=buf.slice(0,cut).trim();if(pendingFiller){s=pendingFiller+" "+s;pendingFiller=""}buf=buf.slice(cut).trim();liveEn.textContent=buf;liveZh.textContent="";if(s.trim())chunkAndArchive(s.trim())}
function chunkAndArchive(text){smartChunk(text,MAX_CHARS).forEach(part=>{part=part.trim();if(!part)return;const wordN=wc(part);const segSpk=diarize?majoritySpeakerOf(0,wordN):-1;if(diarize)bufWords.splice(0,wordN);archive(part,segSpk)})}
function smartChunk(text,maxLen){if(text.length<=maxLen)return[text];const sentences=text.match(/[^.!?]*[.!?]+/g)||[text];const chunks=[];let cur="";for(const s of sentences){if(cur&&(cur+s).length>maxLen){chunks.push(cur.trim());cur=s}else cur+=s}if(cur.trim())chunks.push(cur.trim());return chunks.length?chunks:[text]}
function flush(){let s=buf.trim();if(pendingFiller){s=pendingFiller+" "+s;pendingFiller=""}buf="";liveEn.textContent="";liveZh.textContent="";if(s.trim()){chunkAndArchive(s.trim());bufWords=[]}}
function clean(){try{if(proc){proc.disconnect();proc.onaudioprocess=null}}catch(e){}try{if(src)src.disconnect()}catch(e){}try{if(ac)ac.close()}catch(e){}try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}startBtn.disabled=false;stopBtn.disabled=true;spkBtn.disabled=false}
function archive(en,spk){const d=document.createElement("div");d.className="item";const tag=spk>=0?`<span class="spk" style="background:${spkColor(spk)}">说话人 ${spk+1}</span>`:"";d.innerHTML=tag+'<div class="en"></div><div class="zh"><span class="spinner"></span>翻译中...</div>';const enEl=d.querySelector(".en"),zhEl=d.querySelector(".zh");enEl.textContent=en;enEl.style.fontSize=(17*fontScale)+"px";zhEl.style.fontSize=(21*fontScale)+"px";hist.insertBefore(d,hist.firstChild);while(hist.children.length>MAX_ITEMS)hist.removeChild(hist.lastChild);translateRetry(en,zhEl,2)}
function translateRetry(text,el,tries){translate(text).then(zh=>{el.textContent=zh;rememberContext(text,zh)}).catch(err=>{if(tries>0)setTimeout(()=>translateRetry(text,el,tries-1),800);else el.textContent="[翻译失败] "+err.message})}
async function translate(text){if(typeof text!=="string"||text.trim().length===0)throw new Error("文本为空");if(text.length>MAX_TEXT_CHARS)throw new Error("句子过长");const token=await getTranslationToken();if(!token){throw new Error("翻译凭证未就绪")}const payload={text,context:contextHistory,glossary,mode,courseHint};if(payload.glossary&&payload.glossary.length>MAX_GLOSSARY_CHARS)throw new Error("术语库过长");const r=await fetch(getTranslateUrl(),{method:"POST",headers:{"Content-Type":"application/json",[TRANSLATION_TOKEN_HEADER]:token},body:JSON.stringify(payload)});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"HTTP "+r.status)}const j=await r.json();return j.translation||j.text||""}
</script>
</body>
</html>
