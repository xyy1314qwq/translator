function isFiller(t){const s=t.trim().toLowerCase().replace(/[,;:'"!]+$/,"").replace(/^[,;:'"]+/,"").replace(/[.?!]+$/,"");if(s.split(/\s+/).length>3)return false;return FILLERS.has(s)}
function refreshGlossaryButton(){if(glossary){glossaryBtn.className="glossary-active";glossaryBtn.textContent="术语库 · 已启用"}else{glossaryBtn.className="gray";glossaryBtn.textContent="术语库"}}
function applyFont(){liveEn.style.fontSize=(20*fontScale)+"px";liveZh.style.fontSize=(22*fontScale)+"px";document.querySelectorAll(".en").forEach(el=>el.style.fontSize=(17*fontScale)+"px");document.querySelectorAll(".zh").forEach(el=>el.style.fontSize=(21*fontScale)+"px")}
function rememberContext(en,zh){if(!contextEnabled)return;contextHistory.push({en,zh});if(contextHistory.length>CONTEXT_LIMIT)contextHistory=contextHistory.slice(-CONTEXT_LIMIT)}
glossaryTextarea.value=glossary;apiInput.value=apiUrl;modeSelect.value=mode;courseInput.value=courseHint;refreshGlossaryButton();applyFont();
ctxBtn.setAttribute("aria-pressed",String(contextEnabled));if(contextEnabled){ctxBtn.className="glossary-active";ctxBtn.textContent="上下文：开"}else{ctxBtn.className="gray";ctxBtn.textContent="上下文：关"}
ctxBtn.onclick=()=>{contextEnabled=!contextEnabled;localStorage.setItem("contextEnabled",contextEnabled?"1":"0");ctxBtn.setAttribute("aria-pressed",String(contextEnabled));if(contextEnabled){ctxBtn.className="glossary-active";ctxBtn.textContent="上下文：开"}else{ctxBtn.className="gray";ctxBtn.textContent="上下文：关";contextHistory=[]}};
glossaryBtn.onclick=()=>{glossaryTextarea.value=glossary;glossaryOverlay.showModal();glossaryTextarea.focus()};
glossaryOverlay.onclick=e=>{if(e.target===glossaryOverlay)glossaryOverlay.close()};
glossarySave.onclick=()=>{glossary=glossaryTextarea.value.trim();localStorage.setItem("glossary",glossary);refreshGlossaryButton();glossaryOverlay.close()};
glossaryClear.onclick=()=>{glossaryTextarea.value=""};
settingsBtn.onclick=()=>{apiInput.value=apiUrl;modeSelect.value=mode;courseInput.value=courseHint;settingsOverlay.showModal()};
settingsOverlay.onclick=e=>{if(e.target===settingsOverlay)settingsOverlay.close()};
settingsCancel.onclick=()=>settingsOverlay.close();
$("settingsClose").onclick=()=>settingsOverlay.close();
$("glossaryClose").onclick=()=>glossaryOverlay.close();
settingsSave.onclick=()=>{normalizeApiSettings();settingsOverlay.close()};
fontUp.onclick=()=>{fontScale=Math.min(2.5,fontScale+0.15);localStorage.setItem("fontScale",fontScale);applyFont()};
fontDown.onclick=()=>{fontScale=Math.max(0.6,fontScale-0.15);localStorage.setItem("fontScale",fontScale);applyFont()};
exportBtn.onclick=()=>{const items=hist.getElementsByClassName("item");if(!items.length){alert("没有内容可导出");return}let txt="";for(let i=items.length-1;i>=0;i--){txt+=items[i].querySelector(".en").textContent+"\n"+items[i].querySelector(".zh").textContent+"\n\n"}const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);const d=new Date();a.download="课堂记录_"+d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()+"_"+d.getHours()+"."+d.getMinutes()+".txt";a.click()};
spkBtn.onclick=()=>{if(run){alert("请先停止识别");return}diarize=!diarize;spkBtn.setAttribute("aria-pressed",String(diarize));spkBtn.className=diarize?"glossary-active":"gray";spkBtn.textContent=diarize?"分人：开":"分人：关"};
async function startRecognize(){
  const attempt=++recognitionAttempt;
  startBtn.disabled=true;stopBtn.disabled=false;spkBtn.disabled=true;
  try{
    st("申请麦克风...");
    const captured=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true}});
    if(attempt!==recognitionAttempt){captured.getTracks().forEach(t=>t.stop());return}
    stream=captured;
    await getTranslationToken(true);
    if(attempt!==recognitionAttempt)return;
    ac=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    if(ac.state==="suspended")await ac.resume();
    if(attempt!==recognitionAttempt)return;
    src=ac.createMediaStreamSource(stream);proc=ac.createScriptProcessor(4096,1,1);src.connect(proc);proc.connect(ac.destination);
    const params=new URLSearchParams({diarize:String(diarize)});
    const relayUrl=apiUrl.replace(/^http/,"ws")+"/listen?"+params;
    st(diarize?"连接中（分人开）...":"连接中...");
    const candidate=new WebSocket(relayUrl,["translator",sessionToken.value]);
    ws=candidate;
    const fail=()=>{
      if(candidate!==ws)return;
      candidate.onclose=null;candidate.onerror=null;
      try{candidate.close()}catch(e){}
      clean();st("连接失败，请检查网络或稍后重试");
    };
    candidate._fallbackTimer=setTimeout(fail,15000);
    candidate.onopen=()=>{
      if(candidate!==ws||attempt!==recognitionAttempt){candidate.close();return}
      clearTimeout(candidate._fallbackTimer);run=true;
      st(diarize?"正在识别（分人开）":"正在识别");
      proc.onaudioprocess=e=>{
        if(!run||candidate!==ws||candidate.readyState!==1)return;
        const a=e.inputBuffer.getChannelData(0),pcm=new Int16Array(a.length);
        for(let i=0;i<a.length;i++){const sample=Math.max(-1,Math.min(1,a[i]));pcm[i]=sample<0?sample*0x8000:sample*0x7FFF}
        candidate.send(pcm.buffer);
      };
    };
    candidate.onmessage=ev=>{
      if(candidate!==ws||!run)return;
      let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.type==="UtteranceEnd"){flushReady(false);return}
      if(m.type!=="Results")return;
      const al=m.channel?.alternatives?.[0];if(!al||!al.transcript)return;
      if(m.is_final){
        buf=(buf+" "+al.transcript).trim();
        if(diarize&&al.words?.length)al.words.forEach(w=>bufWords.push(w.speaker||0));
        splitSentencesBuf();liveEn.textContent=buf;if(m.speech_final)flushReady(false);
      }else liveEn.textContent=(buf+" "+al.transcript).trim();
    };
    candidate.onerror=fail;
    candidate.onclose=ev=>{
      if(candidate!==ws)return;
      clean();
      st(ev.code===4008?(ev.reason||"识别额度已达上限"):"连接断开，可以重新开始");
    };
  }catch(error){
    if(attempt!==recognitionAttempt)return;
    clean();st("识别失败："+(error.message||"请稍后重试"));
  }
}
startBtn.onclick=async()=>{if(run)return;contextHistory=[];await startRecognize();}
stopBtn.onclick=()=>{recognitionAttempt++;run=false;flush();if(ws){clearTimeout(ws._fallbackTimer);ws.onerror=null;ws.onclose=null;try{if(ws.readyState===1)ws.send(JSON.stringify({type:"CloseStream"}))}catch(e){}try{if(ws.readyState<=1)ws.close()}catch(e){}}contextHistory=[];clean();st("已停止");startBtn.disabled=false;stopBtn.disabled=true;spkBtn.disabled=false};
function majoritySpeakerOf(start,count){const cnt={};let best=0,bestN=-1;for(let i=start;i<start+count&&i<bufWords.length;i++){const s=bufWords[i];cnt[s]=(cnt[s]||0)+1;if(cnt[s]>bestN){bestN=cnt[s];best=s}}return best}
function wc(t){return t.trim()?t.trim().split(/\s+/).length:0}
function findCut(text,force){text=text.trim();if(!text)return 0;let soft=0;const re=/[.?!,;:]/g;let m;while((m=re.exec(text))!==null){const part=text.slice(0,m.index+1),words=wc(part),mark=m[0];if(/[.?!]/.test(mark))return m.index+1;if(words>=SOFT_WORDS)soft=m.index+1}if(soft)return soft;const words=wc(text);if(force||words>=HARD_WORDS){const tokens=text.match(/\S+\s*/g)||[];const take=force?tokens.length:Math.min(tokens.length,HARD_WORDS);return tokens.slice(0,take).join("").length}return 0}
function splitSentencesBuf(){let emitted=false;for(;;){const cut=findCut(buf,false);if(cut<=0)break;const s=buf.slice(0,cut).trim();if(s){if(isFiller(s)){pendingFiller+=(pendingFiller?" ":"")+s}else{const final=pendingFiller?pendingFiller+" "+s:s;pendingFiller="";chunkAndArchive(final)}emitted=true}buf=buf.slice(cut).trim()}if(emitted){liveEn.textContent=buf;liveZh.textContent=""}}
function flushReady(force){const cut=findCut(buf,force);if(cut<=0)return;let s=buf.slice(0,cut).trim();if(pendingFiller){s=pendingFiller+" "+s;pendingFiller=""}buf=buf.slice(cut).trim();liveEn.textContent=buf;liveZh.textContent="";if(s.trim())chunkAndArchive(s.trim())}
function chunkAndArchive(text){smartChunk(text,MAX_CHARS).forEach(part=>{part=part.trim();if(!part)return;const wordN=wc(part);const segSpk=diarize?majoritySpeakerOf(0,wordN):-1;if(diarize)bufWords.splice(0,wordN);archive(part,segSpk)})}
function smartChunk(text,maxLen){if(text.length<=maxLen)return[text];const sentences=text.match(/[^.!?]*[.!?]+/g)||[text];const chunks=[];let cur="";for(const s of sentences){if(cur&&(cur+s).length>maxLen){chunks.push(cur.trim());cur=s}else cur+=s}if(cur.trim())chunks.push(cur.trim());return chunks.length?chunks:[text]}
function flush(){let s=buf.trim();if(pendingFiller){s=pendingFiller+" "+s;pendingFiller=""}buf="";liveEn.textContent="";liveZh.textContent="";if(s.trim()){chunkAndArchive(s.trim());bufWords=[]}}
function clean(){run=false;try{if(ws)clearTimeout(ws._fallbackTimer)}catch(e){}try{if(proc){proc.disconnect();proc.onaudioprocess=null}}catch(e){}try{if(src)src.disconnect()}catch(e){}try{if(ac)ac.close()}catch(e){}try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}startBtn.disabled=false;stopBtn.disabled=true;spkBtn.disabled=false}
function archive(en,spk){const d=document.createElement("div");d.className="item";const tag=spk>=0?`<span class="spk" style="background:${spkColor(spk)}">说话人 ${spk+1}</span>`:"";d.innerHTML=tag+'<div class="en"></div><div class="zh"><span class="spinner"></span>翻译中...</div>';const enEl=d.querySelector(".en"),zhEl=d.querySelector(".zh");enEl.textContent=en;enEl.style.fontSize=(17*fontScale)+"px";zhEl.style.fontSize=(21*fontScale)+"px";hist.insertBefore(d,hist.firstChild);while(hist.children.length>MAX_ITEMS)hist.removeChild(hist.lastChild);translateRetry(en,zhEl,2)}
function translateRetry(text,el,tries){translate(text).then(zh=>{el.textContent=zh;rememberContext(text,zh)}).catch(err=>{if(tries>0&&err.status!==429)setTimeout(()=>translateRetry(text,el,tries-1),800);else el.textContent="[翻译失败] "+err.message})}
async function translate(text){if(typeof text!=="string"||text.trim().length===0)throw new Error("文本为空");if(text.length>MAX_TEXT_CHARS)throw new Error("句子过长");const token=await getTranslationToken();if(!token){throw new Error("翻译凭证未就绪")}const payload={text,context:contextHistory,glossary,mode,courseHint};if(payload.glossary&&payload.glossary.length>MAX_GLOSSARY_CHARS)throw new Error("术语库过长");const r=await fetch(getTranslateUrl(),{method:"POST",headers:{"Content-Type":"application/json",[TRANSLATION_TOKEN_HEADER]:token},body:JSON.stringify(payload)});if(!r.ok){const j=await r.json().catch(()=>({}));const error=new Error(j.error||"HTTP "+r.status);error.status=r.status;throw error}const j=await r.json();return j.translation||j.text||""}
</script>
